# djrs configuration for the sample project.
#
# DRF views are translated to Rust automatically. A view the translator can't
# handle can get a hand-written Rust handler ("shim") here; a view named here
# uses its shim even when it also translates.

[shims]
notes_shims = "rust/notes_shims.rs"

[drf_handlers."notes.views.priority_stats"]
GET = "notes_shims::priority_stats"
