[package]
name = "djrs-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for binaries generated by djrs: Django-order URL resolution and a transparent proxy to Django"

[dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.14"
flate2 = "1"
form_urlencoded = "1"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
indexmap = "2"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "server-graceful", "tokio"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
percent-encoding = "2"
rust_decimal = "1"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "with-chrono", "with-json", "with-uuid", "with-rust_decimal", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "postgres", "sqlite", "runtime-tokio", "chrono"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util"] }
