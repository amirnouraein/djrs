name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests

  # The sample project on a spread of Django / DRF / Python versions.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8", django: "3.0.*", drf: "3.11.*" }
          - { python: "3.9", django: "3.2.*", drf: "3.14.*" }
          - { python: "3.11", django: "4.2.*", drf: "3.15.*" }
          - { python: "3.12", django: "5.2.*", drf: "3.16.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Python ${{ matrix.python }} with Django ${{ matrix.django }}
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python "django==${{ matrix.django }}" "djangorestframework==${{ matrix.drf }}" -e .
      - run: PYTHON=$PWD/.venv/bin/python scripts/e2e.sh

  # The sample project on MySQL and PostgreSQL (Django 5.2).
  e2e-databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notes
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "django==5.2.*" "djangorestframework==3.16.*" mysqlclient "psycopg[binary]" -e .
      - name: e2e on ${{ matrix.db }}
        run: |
          if [ "${{ matrix.db }}" = mysql ]; then
            export NOTES_DB_ENGINE=django.db.backends.mysql NOTES_DB_NAME=notes NOTES_DB_USER=root NOTES_DB_PASSWORD=root NOTES_DB_HOST=127.0.0.1 NOTES_DB_PORT=3306
          else
            export NOTES_DB_ENGINE=django.db.backends.postgresql NOTES_DB_NAME=postgres NOTES_DB_USER=postgres NOTES_DB_PASSWORD=pg NOTES_DB_HOST=127.0.0.1 NOTES_DB_PORT=5432
          fi
          PYTHON=$PWD/.venv/bin/python scripts/e2e.sh
